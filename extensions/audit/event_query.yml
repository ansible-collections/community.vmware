---
community.vmware.vmware_guest:
  query: >-
    .instance | {
      name: .moid,
      canonical_facts: {
        instance_uuid: .instance_uuid,
        bios_uuid: .hw_product_uuid,
        moid: .moid,
        esxi: .hw_esxi_host
      },
      facts: {
        infra_type: "private_cloud",
        infra_bucket: "compute",
        device_type: "virtual_machine"
      }
    }
