- import_role:
    name: prepare_vmware_tests
  vars:
    setup_attach_host: true
    setup_datastore: true

- name: Run the vmware_vmdk_clone and vmware_vmdk_info tests
  include_tasks: vmdk.yml
  vars:
    vmdk_datacenter: '{{ dc1 }}'
    vmdk_cluster: '{{ ccr1 }}'
    vmdk_datastore: '{{ rw_datastore }}'
