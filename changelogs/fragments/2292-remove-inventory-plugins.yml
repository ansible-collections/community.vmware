removed_features:
  - plugin_utils.inventory - The deprecated plugin util has been removed
    (https://github.com/ansible-collections/community.vmware/issues/2292).
  - vmware_host_inventory - The deprecated inventory plugin has been removed. Use ``vmware.vmware.esxi_hosts`` instead
    (https://github.com/ansible-collections/community.vmware/issues/2292).
  - vmware_vm_inventory - The deprecated inventory plugin has been removed. Use ``vmware.vmware.vms`` instead
    (https://github.com/ansible-collections/community.vmware/issues/2292).
