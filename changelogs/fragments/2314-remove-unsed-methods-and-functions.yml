removed_features:
  - module_utils.vmware_rest_client - The deprecated ``VmwareRestClient.get_folder_by_name`` method has been removed
    (https://github.com/ansible-collections/community.vmware/pull/2314).
  - module_utils.vm_device_helper - The deprecated ``PyVmomiDeviceHelper.is_nvdimm_controller`` method has been removed
    (https://github.com/ansible-collections/community.vmware/pull/2314).
  - module_utils.vm_device_helper - The deprecated ``PyVmomiDeviceHelper.is_nvdimm_device`` method has been removed
    (https://github.com/ansible-collections/community.vmware/pull/2314).
  - module_utils.vmware - The deprecated ``find_host_portgroup_by_name`` function and
    ``PyVmomi.find_host_portgroup_by_name`` method have been removed
    (https://github.com/ansible-collections/community.vmware/pull/2314).
  - module_utils.vmware - The deprecated ``PyVmomi.network_exists_by_name`` method has been removed
    (https://github.com/ansible-collections/community.vmware/pull/2314).
  - module_utils.vmware - The deprecated ``PyVmomi.vmdk_disk_path_split`` method has been removed
    (https://github.com/ansible-collections/community.vmware/pull/2314).
  - module_utils.vmware - The deprecated ``PyVmomi.find_vmdk_file`` method has been removed
    (https://github.com/ansible-collections/community.vmware/pull/2314).
